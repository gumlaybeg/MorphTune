name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # Added a retry fallback. If it fails with a 429, it waits 15 seconds and tries again.
        run: >
          ./gradlew assembleDebug --no-daemon || 
          (echo "Retrying..." && sleep 15 && ./gradlew assembleDebug --no-daemon) ||
          (echo "Retrying again..." && sleep 15 && ./gradlew assembleDebug --no-daemon)

      - name: Build Release APK
        # Same retry fallback here.
        run: >
          ./gradlew assembleRelease --no-daemon || 
          (echo "Retrying..." && sleep 15 && ./gradlew assembleRelease --no-daemon) ||
          (echo "Retrying again..." && sleep 15 && ./gradlew assembleRelease --no-daemon)

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorphTune-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorphTune-Release-Unsigned-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
