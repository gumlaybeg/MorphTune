name: Build Release APK

on:
  # Automatically starts the workflow on every commit pushed to these branches
  push:
    branches:
      - master
      - main
  # Still allows you to run it manually just in case
  workflow_dispatch: 

jobs:
  build:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update the GitHub Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        # Only runs the release build task
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to GitHub Artifacts
        # This attaches the APK to the action run log so you can download it directly from the "Actions" tab
        uses: actions/upload-artifact@v4
        with:
          name: MorphTune-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Update 'Latest Build' on Releases Page
        # This keeps a single "Latest" release continually updated with your newest commit
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build (Auto-updated)"
          body: "This is an automatically generated build from the latest commit: ${{ github.sha }}"
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
